spring.application.name=ilac-takip

server.port=8080

# H2 file database (relational). Survives restart. Later swap this URL to PostgreSQL.
# Path is under the user home so data does not depend on the process working directory.
spring.datasource.url=jdbc:h2:file:${user.home}/.ilac-takip/db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.config.import=optional:file:${user.home}/.ilac-takip/oauth.properties

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
app.frontend-url=http://localhost:5173

spring.security.oauth2.client.registration.google.scope=openid,profile,email

server.servlet.session.cookie.same-site=lax
