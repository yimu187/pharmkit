spring.application.name=ilac-takip

server.port=8080

# Neon PostgreSQL (pooled). Password is in ~/.ilac-takip/oauth.properties, imported below.
# channelBinding is the JDBC name of channel_binding. prepareThreshold=0 is required on Neon's pooler.
spring.datasource.url=jdbc:postgresql://ep-misty-lake-b9p6a7pw-pooler.c-7.eu-central-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require&prepareThreshold=0
spring.datasource.username=neondb_owner

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.config.import=optional:file:${user.home}/.ilac-takip/oauth.properties

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
app.frontend-url=http://localhost:5173

spring.security.oauth2.client.registration.google.scope=openid,profile,email

server.servlet.session.cookie.same-site=lax
